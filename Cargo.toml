[workspace]
members = [
    "src/mail/auth/adapter-outbound",
    "src/mail/auth/domain",
    "src/mail/capability/domain",
    "src/mail/runtime/composition",
    "src/mail/web/adapter-outbound",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/albertovillaosorno/protonmail-ai"
rust-version = "1.98.1"
publish = false
readme = "README.md"
keywords = ["ai-agents", "email", "local-first", "mcp", "proton-mail"]

[workspace.dependencies]
# Member crates inherit every dependency from this table. External versions live
# only here and track the newest stable release supported by the workspace.
base64 = "=0.23.1"
command-fds = "=0.3.3"
getrandom = "=0.4.3"
mail_auth_domain = { path = "src/mail/auth/domain" }
mail_auth_fork_adapter = { path = "src/mail/auth/adapter-outbound" }
mail_capability_domain = { path = "src/mail/capability/domain" }
mail_web_adapter = { path = "src/mail/web/adapter-outbound" }
serde_json = "=1.0.151"
zeroize = "=1.9.0"

[workspace.dependencies.aes-gcm]
version = "=0.11.1"
features = ["zeroize"]

[workspace.dependencies.nix]
version = "=0.31.3"
features = ["fs"]

[workspace.dependencies.serde]
version = "=1.0.229"
features = ["derive"]

[workspace.lints.rust]
# Compiler warnings are binary failures. Unsafe Rust is categorically outside
# Jig's implementation contract.
warnings = "deny"
unsafe_code = "forbid"

# Explicit language, lifetime, visibility, migration, and dead-surface checks.
absolute_paths_not_starting_with_crate = "deny"
ambiguous_negative_literals = "deny"
closure_returning_async_block = "deny"
deprecated_in_future = "deny"
deprecated_safe_2024 = "deny"
deref_into_dyn_supertrait = "deny"
edition_2024_expr_fragment_specifier = "deny"
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
ffi_unwind_calls = "deny"
if_let_rescope = "deny"
impl_trait_overcaptures = "deny"
impl_trait_redundant_captures = "deny"
keyword_idents = { level = "deny", priority = -1 }
keyword_idents_2018 = "deny"
keyword_idents_2024 = "deny"
let_underscore_drop = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
missing_abi = "deny"
missing_copy_implementations = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"
missing_unsafe_on_extern = "deny"
non_ascii_idents = "deny"
redundant_imports = "deny"
redundant_lifetimes = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2021_incompatible_closure_captures = "deny"
rust_2021_incompatible_or_patterns = "deny"
rust_2021_prefixes_incompatible_syntax = "deny"
rust_2021_prelude_collisions = "deny"
rust_2024_compatibility = { level = "deny", priority = -1 }
rust_2024_guarded_string_incompatible_syntax = "deny"
rust_2024_incompatible_pat = "deny"
rust_2024_prelude_collisions = "deny"
single_use_lifetimes = "deny"
tail_expr_drop_order = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unnameable_types = "deny"
unreachable_pub = "deny"
unsafe_attr_outside_unsafe = "deny"
unsafe_op_in_unsafe_fn = "deny"
unstable_features = "deny"
unused_extern_crates = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_must_use = "deny"
unused_qualifications = "deny"
variant_size_differences = "deny"

[workspace.lints.clippy]
# Broad families stay below named rules so an individually selected invariant
# always wins if upstream group membership changes.
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# Restriction lints are selected individually. The full restriction group is not
# enabled because it intentionally contains contradictory policies.
absolute_paths = "deny"
as_conversions = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
as_pointer_underscore = "deny"
as_underscore = "deny"
fn_to_numeric_cast_any = "deny"
cfg_not_test = "deny"
cognitive_complexity = "deny"
create_dir = "deny"
dbg_macro = "deny"
default_numeric_fallback = "deny"
default_union_representation = "deny"
disallowed_script_idents = "deny"
doc_include_without_cfg = "deny"
doc_paragraphs_missing_punctuation = "deny"
unnecessary_safety_doc = "deny"
mem_forget = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
host_endian_bytes = "deny"
exit = "deny"
lossy_float_literal = "deny"
pointer_format = "deny"
impl_trait_in_params = "deny"
renamed_function_params = "deny"
multiple_inherent_impl = "deny"
non_zero_suggestions = "deny"
inline_trait_bounds = "deny"
iter_over_hash_type = "deny"
large_include_file = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
infinite_loop = "deny"
rest_pat_in_fully_bound_structs = "deny"
try_err = "deny"
wildcard_enum_match_arm = "deny"
clone_on_ref_ptr = "deny"
filetype_is_file = "deny"
get_unwrap = "deny"
map_err_ignore = "deny"
map_with_unused_argument_over_ranges = "deny"
string_lit_chars_any = "deny"
verbose_file_reads = "deny"
min_ident_chars = "deny"
self_named_module_files = "deny"
semicolon_inside_block = "deny"
separated_literal_suffix = "deny"
unneeded_field_pattern = "deny"
missing_trait_methods = "deny"
mixed_read_write_in_expression = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
arithmetic_side_effects = "deny"
float_cmp = "deny"
float_cmp_const = "deny"
integer_division = "deny"
integer_division_remainder_used = "deny"
modulo_arithmetic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
partial_pub_fields = "deny"
pathbuf_init_then_push = "deny"
precedence_bits = "deny"
needless_raw_strings = "deny"
deref_by_slicing = "deny"
ref_patterns = "deny"
redundant_test_prefix = "deny"
same_name_method = "deny"
single_char_lifetime_names = "deny"
str_to_string = "deny"
string_add = "deny"
string_slice = "deny"
suspicious_xor_used_as_pow = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
unnecessary_safety_comment = "deny"
non_ascii_literal = "deny"
unnecessary_self_imports = "deny"
unused_result_ok = "deny"
unused_trait_names = "deny"
pub_without_shorthand = "deny"
use_debug = "deny"
