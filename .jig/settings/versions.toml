domain = "versions"
schema_version = 1

[authority.protonmail-ai]
current = "0.0.0"
stable = "0.0.0"

[authority.protonmail-ai.projection.cargo_workspace]
kind = "toml"
path = "Cargo.toml"
selector = "workspace.package.version"
template = "{version}"

[authority.rust-stable]
current = "1.98.1"
stable = "1.98.1"

[authority.rust-stable.projection.cargo_rust_version]
kind = "toml"
path = "Cargo.toml"
selector = "workspace.package.rust-version"
template = "{version}"

[authority.rust-stable.projection.rust_toolchain]
kind = "toml"
path = "rust-toolchain.toml"
selector = "toolchain.channel"
template = "{version}"

[authority.rust-stable.projection.tool]
kind = "tool"
target = "rust_stable_cargo"
template = "{version}"

[authority.rust-nightly-validation]
current = "nightly-2026-09-03"
stable = "nightly-2026-09-03"

[authority.rust-nightly-validation.projection.validation_toolchain]
kind = "toml"
path = ".jig/lang/rust/validation-toolchain.toml"
selector = "channel"
template = "{version}"

[authority.clippy-nightly-validation]
current = "0.1.100"
stable = "0.1.100"

[authority.clippy-nightly-validation.projection.validation_toolchain]
kind = "toml"
path = ".jig/lang/rust/validation-toolchain.toml"
selector = "clippy"
template = "{version}"

[authority.clippy-nightly-validation.projection.tool]
kind = "tool"
target = "rust_nightly_cargo_clippy"
template = "{version}"

[authority.rustfmt-nightly-validation]
current = "1.10.0-nightly"
stable = "1.10.0-nightly"

[authority.rustfmt-nightly-validation.projection.validation_toolchain]
kind = "toml"
path = ".jig/lang/rust/validation-toolchain.toml"
selector = "rustfmt"
template = "{version}"

[authority.rustfmt-nightly-validation.projection.tool]
kind = "tool"
target = "rust_nightly_cargo_fmt"
template = "{version}"

[authority.rustc-nightly-validation]
current = "1.100.0-nightly"
stable = "1.100.0-nightly"

[authority.rustc-nightly-validation.projection.validation_toolchain]
kind = "toml"
path = ".jig/lang/rust/validation-toolchain.toml"
selector = "rustc"
template = "{version}"

[authority.jig]
current = "26.3.0"
stable = "26.3.0"

[authority.jig.projection.tool]
kind = "tool"
target = "jig"
template = "{version}"

[authority.git]
current = "2.55.0"
stable = "2.55.0"

[authority.git.projection.tool]
kind = "tool"
target = "git"
template = "{version}"

[authority.command-fds]
current = "0.3.3"
stable = "0.3.3"

[authority.command-fds.freshness]
integrity_kind = "provider-response-sha256"
maximum_age_days = 30
provider = "crates-io"
source = "https://crates.io/api/v1/crates/command-fds"

[authority.command-fds.projection.cargo_workspace]
kind = "toml"
path = "Cargo.toml"
selector = "workspace.dependencies.command-fds"
template = "={version}"
