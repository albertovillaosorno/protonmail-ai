domain = "versions"
schema_version = 1

[authority.aes-gcm]
current = "0.11.1"
stable = "0.11.1"

[authority.aes-gcm.freshness]
integrity_kind = "provider-response-sha256"
maximum_age_days = 30
provider = "crates-io"
source = "https://crates.io/api/v1/crates/aes-gcm"

[authority.aes-gcm.projection.cargo_workspace]
kind = "toml"
path = "Cargo.toml"
selector = "workspace.dependencies.aes-gcm.version"
template = "={version}"

